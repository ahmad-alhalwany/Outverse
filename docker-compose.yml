# Outverse — full-stack local orchestration.
# Usage: docker compose up --build
#
# Brings up Postgres, the Django API (daphne/ASGI for websockets),
# and the Next.js dashboard. Media + static uploads are persisted
# via named volumes. Configure secrets in a top-level .env file
# (see .env.example) — never commit real credentials.
#
# Required env (passed via .env):
#   POSTGRES_PASSWORD, DJANGO_SECRET_KEY
# Optional:
#   OPENAI_API_KEY / ANTHROPIC_API_KEY (LLM features)
#   SENTRY_DSN (backend), NEXT_PUBLIC_SENTRY_DSN (frontend)
#   VAPID_* (browser push — run: python scripts/generate_vapid_env.py)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outverse}
      POSTGRES_USER: ${POSTGRES_USER:-outverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outverse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-outverse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-outverse}
      POSTGRES_HOST: db
      POSTGRES_NAME: ${POSTGRES_DB:-outverse}
      POSTGRES_USER: ${POSTGRES_USER:-outverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-mailto:admin@outverse.local}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 outverse.asgi:application"

  frontend:
    build:
      context: ./outverse-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "3000:3000"

  # Local parity with prod: scheduled posts, premieres, digests.
  cron:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-outverse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-outverse}
      POSTGRES_HOST: db
      POSTGRES_NAME: ${POSTGRES_DB:-outverse}
      POSTGRES_USER: ${POSTGRES_USER:-outverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CRON_DIGEST_HOUR: ${CRON_DIGEST_HOUR:-08}
      CRON_DIGEST_MINUTE: ${CRON_DIGEST_MINUTE:-00}
    volumes:
      - backend_media:/app/media
    entrypoint: ["/bin/sh", "/app/scripts/cron-loop.sh"]

volumes:
  pgdata:
  backend_media:
  backend_static:
