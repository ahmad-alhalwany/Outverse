<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Outverse</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #161019;
        color: #F7EFEA;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 420px; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; color: #D89A7E; }
      p { margin: 0 0 1.5rem; color: #D1B8AC; line-height: 1.5; }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: #A0583D;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You've drifted off-network</h1>
      <p>Outverse needs a connection to fetch your feed, capsules, and rooms. Reconnect and we'll bring you back to where you were.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
